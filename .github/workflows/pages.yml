name: Publish English Improve

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Google Drive Sync Pointer
        id: sync_check
        run: |
          set +e
          rm -f /tmp/pointer_hdr.txt
          curl -fsSL -D /tmp/pointer_hdr.txt "https://drive.usercontent.google.com/download?id=1PQ5dlKERVS7WBqiOTzthfxGxjFQ353YK&export=download&confirm=t" -o /tmp/pointer.bin 2>/dev/null || true
          ZIP_ID=$(cat /tmp/pointer_hdr.txt 2>/dev/null | tr -d '\\\r"' | grep -oE 'SYNC_ZIP_ID(=|%3D)[A-Za-z0-9_-]+' | head -n 1 | sed -E 's/^SYNC_ZIP_ID(=|%3D)//')
          if [ -z "$ZIP_ID" ] || [ "$ZIP_ID" = "1FgTueG8PNsm_EXD_HXF3cWSlQ6IG4ihP" ]; then
            POINTER_TEXT=$(curl -fsSL "https://docs.google.com/document/d/13_jOtIm17JeKmAQuIwDHHZQq5L4SAytL-TFtgUc33nw/export?format=txt" 2>/dev/null | tr -d '\\\r')
            ZIP_ID=$(printf "%s" "$POINTER_TEXT" | grep -oE 'SYNC_ZIP_ID=[A-Za-z0-9_-]+' | head -n 1 | cut -d= -f2)
          fi
          if [ -z "$ZIP_ID" ] || [ "$ZIP_ID" = "1FgTueG8PNsm_EXD_HXF3cWSlQ6IG4ihP" ]; then
            ZIP_ID="1mzK0GJXrz5BNW8bJTZmk8VQKcis3w76L"
          fi
          LAST_ID=""
          if [ -f .last-sync-id ]; then LAST_ID=$(tr -d '[:space:]' < .last-sync-id); fi
          echo "Pointer ZIP_ID=$ZIP_ID | Repo LAST_ID=$LAST_ID | Event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$ZIP_ID" = "$LAST_ID" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "zip_id=$ZIP_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.sync_check.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync latest package from Google Drive and rebuild bundle
        if: steps.sync_check.outputs.should_deploy == 'true'
        run: |
          ZIP_ID="${{ steps.sync_check.outputs.zip_id }}"
          echo "Downloading sync package ZIP_ID=$ZIP_ID ..."
          rm -f /tmp/col-update.zip
          curl -fsSL "https://drive.usercontent.google.com/download?id=${ZIP_ID}&export=download&confirm=t" -o /tmp/col-update.zip || \
          curl -fsSL -L "https://drive.google.com/uc?export=download&id=${ZIP_ID}" -o /tmp/col-update.zip
          unzip -oq /tmp/col-update.zip -d .
          if [ -f build-photo-topics.cjs ]; then node build-photo-topics.cjs; fi
          node build-collocations.cjs
          node integrate-v4.cjs
          node audio-tools/install.cjs

      - name: Save synced version marker to repository
        if: steps.sync_check.outputs.should_deploy == 'true'
        run: |
          ZIP_ID="${{ steps.sync_check.outputs.zip_id }}"
          LAST_ID=""
          if [ -f .last-sync-id ]; then LAST_ID=$(tr -d '[:space:]' < .last-sync-id); fi
          if [ "$ZIP_ID" != "$LAST_ID" ]; then
            echo "$ZIP_ID" > .last-sync-id
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .last-sync-id
            git commit -m "Auto-sync Google Drive package $ZIP_ID [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Verify reading, grammar, collocation, photo, and audio integrity
        if: steps.sync_check.outputs.should_deploy == 'true'
        run: |
          node test-audio.cjs
          node test-audio-controls.cjs
          node test-a2.cjs
          node test-b1.cjs
          node test-advanced.cjs
          node test-v4.cjs
          node test-collocations.cjs
          if [ -f test-real-photos.cjs ]; then node test-real-photos.cjs; fi

      - name: Prepare static site
        if: steps.sync_check.outputs.should_deploy == 'true'
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R audio _site/audio

      - name: Upload Pages artifact
        if: steps.sync_check.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy != 'false' && (always() && needs.build.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
