name: Publish English Improve
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync latest package from Google Drive and rebuild bundle
        run: |
          set +e
          POINTER_TEXT=$(curl -fsSL "https://docs.google.com/document/d/13_jOtIm17JeKmAQuIwDHHZQq5L4SAytL-TFtgUc33nw/export?format=txt" 2>/dev/null)
          ZIP_ID=$(printf "%s" "$POINTER_TEXT" | grep -oE 'SYNC_ZIP_ID=[A-Za-z0-9_-]+' | head -n 1 | cut -d= -f2)
          if [ -z "$ZIP_ID" ]; then ZIP_ID="12tfaJLcd2y4QtRsbMAET97pM_WHMEJ4K"; fi
          echo "Syncing package from Google Drive ID: $ZIP_ID"
          curl -fsSL "https://drive.usercontent.google.com/download?id=${ZIP_ID}&export=download&confirm=t" -o /tmp/col-update.zip || true
          if ! unzip -tq /tmp/col-update.zip >/dev/null 2>&1; then
            curl -fsSL -L "https://drive.google.com/uc?export=download&id=${ZIP_ID}" -o /tmp/col-update.zip || true
          fi
          set -e
          unzip -tq /tmp/col-update.zip
          mkdir -p /tmp/col-extract
          unzip -oq /tmp/col-update.zip -d /tmp/col-extract
          cp -R /tmp/col-extract/. .
          node build-collocations.cjs
          node integrate-v4.cjs
          node audio-tools/install.cjs
      - name: Check learning content and interactions
        run: |
          node test-audio.cjs
          node test-audio-controls.cjs
          node test-a2.cjs
          node test-b1.cjs
          node test-advanced.cjs
          node test-v4.cjs
          node test-collocations.cjs
      - name: Commit synced files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-sync updates from Google Drive and rebuild index.html [skip ci]"
            git push origin HEAD:main || true
          fi
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R audio _site/audio
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
